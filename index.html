// Render body text — lines starting with emoji+bold label get bolded label
function BodyText({ text, style }) {
  const lines = text.split('\n');
  return (
    <div style={style}>
      {lines.map((line, i) => {
        // Match lines like "🏠 Bold Title: rest" or "🏠 Bold Title — rest"
        const m = line.match(/^([\u{1F000}-\u{1FFFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}✂️🌍💊💉🏥💻🌟🤝📱📚🏗️📣🏡🔢😿💛💔❤️🚗😿🏠🩺📋💰📸]*\s*)(\*\*(.+?)\*\*|([^:\—–-]+?))([:\—–-]\s*)(.*)/us);
        if (line.trim() === '') return <div key={i} style={{ height:6 }}/>;
        // Detect lines with a leading emoji followed by bold-worthy label
        const boldMatch = line.match(/^([\u{1F000}-\u{1FFFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}✂️🌍💊💉🏥💻🌟🤝📱📚🏗️📣📋💰📸❤️🚗😿🏠🩺💛💔🔢]*\s*)([^:]+)(:)(.*)/su);
        if (boldMatch) {
          return (
            <div key={i} style={{ marginBottom:3 }}>
              <span style={{ fontWeight:800 }}>{boldMatch[1]}{boldMatch[2]}{boldMatch[3]}</span>
              <span>{boldMatch[4]}</span>
            </div>
          );
        }
        return <div key={i} style={{ marginBottom:3 }}>{line}</div>;
      })}
    </div>
  );
}

// Timeline component for "Proof That Rescue Work Works"

        <div style={{ position:"absolute", left:"10%", right:"10%", top:"50%", transform:"translateY(-50%)", height:4, background:"#e5e7eb", borderRadius:999, zIndex:0 }}/>

          <div style={{ width:"100%", height:"100%", background:`linear-gradient(to right, ${B.orange}, ${B.blue}, #22c55e)` }}/>

  );

function Quiz() {
  const [qi,setQi]=useState(0);
  const [sel,setSel]=useState(null);
  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  const pick=(i)=>{if(sel!==null)return;setSel(i);if(i===QS[qi].ans)setScore(s=>s+1);};
  const next=()=>{if(qi+1>=QS.length)setDone(true);else{setQi(q=>q+1);setSel(null);}};
  const reset=()=>{setQi(0);setSel(null);setScore(0);setDone(false);};

  if(done) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",background:B.white,borderRadius:16,padding:"20px 16px",boxShadow:"0 4px 16px rgba(0,0,0,0.07)",textAlign:"center"}}>
      {score===QS.length
        ?<img src="img-badge.png" alt="Feline Friend Badge" style={{width:120,height:120,objectFit:"contain",display:"block",margin:"0 auto"}} onError={e=>e.target.style.display="none"}/>
        :<div style={{fontSize:56}}>{score>=3?"⭐":"💪"}</div>
      }
      <div style={{fontSize:24,color:B.orange,margin:"10px 0 5px",...H()}}>{score} / {QS.length}</div>
      <div style={{color:"#4b5563",marginBottom:score===QS.length?4:14,...T()}}>
        {score===QS.length?"Perfect score! You have earned your Feline Friend badge!":score>=3?"Great work — keep learning!":"Keep going — every fact helps save a cat!"}
      </div>
      {score===QS.length&&<div style={{fontSize:12,color:B.orange,marginBottom:12,...H()}}>🏅 You are officially a Feline Friend!</div>}
      <button onClick={reset} style={{padding:"9px 22px",background:B.orange,color:B.white,border:"none",borderRadius:999,...H()}}>Try Again 🔄</button>
    </div>
  );

  const q=QS[qi];
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:B.white,borderRadius:16,padding:"14px 16px",boxShadow:"0 4px 16px rgba(0,0,0,0.07)"}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10,flexShrink:0}}>
        <span style={{color:"#6b7280",...T()}}>Question {qi+1} of {QS.length}</span>
        <span style={{color:B.orange,...H()}}>Score: {score}</span>
      </div>
      <div style={{background:B.cream,borderRadius:10,padding:"11px 13px",marginBottom:12,flexShrink:0}}>
        <div style={{color:B.dark,...H()}}>{q.q}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8,flex:1,minHeight:0,overflow:"hidden"}}>
        {q.opts.map((opt,i)=>{
          let bg="#f9fafb",border="#e5e7eb",col=B.dark;
          if(sel!==null){if(i===q.ans){bg="#f0fdf4";border="#22c55e";col="#166534";}else if(i===sel){bg="#fef2f2";border="#ef4444";col="#991b1b";}}
          return <button key={i} onClick={()=>pick(i)} style={{padding:"9px 12px",borderRadius:10,border:`2px solid ${border}`,background:bg,color:col,textAlign:"left",cursor:sel===null?"pointer":"default",flexShrink:0,...T()}}>{["A","B","C","D"][i]}. {opt}</button>;
        })}
        {sel!==null&&<>
          <div style={{background:"#fffbeb",borderRadius:10,padding:"10px 12px",borderLeft:`4px solid ${B.yellow}`,flexShrink:0,...T()}}>
            <span style={{...H()}}>💡 Did you know? </span>{q.fact}
          </div>
          <button onClick={next} style={{padding:10,background:B.orange,color:B.white,border:"none",borderRadius:999,flexShrink:0,...H()}}>
            {qi+1<QS.length?"Next Question →":"See My Score!"}
          </button>
        </>}
      </div>
    </div>
  );
}

function App() {
  const [tab,setTab]=useState("welcome");
  const [idxMap,setIdxMap]=useState({welcome:0,intro:0,facts:0,journey:0});

  const go=(delta)=>{
    setIdxMap(prev=>{
      const slides=SLIDES[tab];
      const n=Math.min(Math.max(prev[tab]+delta,0),slides.length-1);
      return {...prev,[tab]:n};
    });
  };

  const isQuiz=tab==="quiz";
  const slides=isQuiz?null:SLIDES[tab];
  const idx=isQuiz?0:idxMap[tab];
  const slide=isQuiz?null:slides[idx];
  const total=isQuiz?0:slides.length;
  const ac=isQuiz?B.orange:slide.color;
  const isWelcome=!isQuiz&&slide.id==="welcome";
  const hasTimeline=!isQuiz&&slide.id==="facts-4";

  return (
    <div className="app">
      {/* Tab bar */}
      <div className="tab-bar">
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>switchTab(t.id)}
            style={{padding:"7px 12px",borderRadius:999,border:`2px solid ${tab===t.id?B.orange:"#d1d5db"}`,background:tab===t.id?B.orange:B.white,color:tab===t.id?B.white:B.dark,whiteSpace:"nowrap",flexShrink:0,...(tab===t.id?H():T())}}>
            {t.emoji} {t.label}
          </button>
        ))}
      </div>

      {/* Slide area */}
      <div className="slide-area">
        {isQuiz?<Quiz/>:(
          <div className="slide-card" style={{border:`2px solid ${ac}22`}}>

            {/* Counter */}
            <div className="slide-fixed" style={{marginBottom:6}}>
              <span style={{display:"inline-block",background:ac,color:ac===B.yellow?B.dark:B.white,borderRadius:999,padding:"2px 12px",...H({fontSize:11})}}>
                {idx+1} / {total}
              </span>
            </div>

            {/* Title */}
            <div className="slide-fixed" style={{...H({fontSize:18,lineHeight:1.2,marginBottom:6,color:B.dark})}}>
              {slide.title}
            </div>

            {/* Image — flex:1 fills remaining space */}
            {isWelcome?(
              <img src="img-badge.png" alt="Feline Friend Badge" className="badge-img" onError={e=>e.target.style.display="none"}/>
            ):IMGS[slide.id]?(
              <img src={IMGS[slide.id]} alt={slide.title} className="slide-img" onError={e=>e.target.style.display="none"}/>
            ):null}

            {/* Body */}
            <BodyText
              text={slide.body}
              style={{...T({color:"#374151",lineHeight:1.6,marginBottom:6,flexShrink:0})}}
            />

            {/* Timeline (facts-4 only) */}
            {hasTimeline&&<Timeline/>}

            {/* Callout */}
            {slide.callout&&(
              <div className="slide-fixed" style={{background:slide.bg,borderRadius:10,padding:"9px 12px",borderLeft:`4px solid ${ac}`,...T({color:B.dark,marginTop:6})}}>
                {slide.callout}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Nav */}
      {!isQuiz&&(
        <div className="nav-bar">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%"}}>
            <button onClick={()=>go(-1)} disabled={idx===0}
              style={{padding:"7px 14px",borderRadius:999,border:"none",background:idx===0?"#e5e7eb":ac,color:idx===0?"#9ca3af":ac===B.yellow?B.dark:B.white,...H({fontSize:12})}}>
              ← Back
            </button>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"center",maxWidth:160}}>
              {slides.map((_,i)=>(
                <div key={i} onClick={()=>setIdxMap(prev=>({...prev,[tab]:i}))}
                  style={{width:i===idx?16:7,height:7,borderRadius:999,background:i===idx?ac:"#d1d5db",cursor:"pointer",transition:"all .3s",flexShrink:0}}/>
              ))}
            </div>
            <button onClick={()=>go(1)} disabled={idx===total-1}
              style={{padding:"7px 14px",borderRadius:999,border:"none",background:idx===total-1?"#e5e7eb":ac,color:idx===total-1?"#9ca3af":ac===B.yellow?B.dark:B.white,...H({fontSize:12})}}>
              Next →
            </button>
          </div>
          {(()=>{
            const tids=TABS.map(t=>t.id);
            const ti=tids.indexOf(tab);
            const pv=ti>0?TABS[ti-1]:null;
            const nx=ti<TABS.length-1?TABS[ti+1]:null;
            return (
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",borderTop:"1px solid #e5e7eb",paddingTop:6}}>
                <button onClick={()=>pv&&switchTab(pv.id)} disabled={!pv}
                  style={{padding:"6px 10px",borderRadius:999,border:`1.5px solid ${pv?B.dark:"#e5e7eb"}`,background:"transparent",color:pv?B.dark:"#d1d5db",whiteSpace:"nowrap",...H({fontSize:11})}}>
                  {pv?`← ${pv.emoji} ${pv.label}`:""}
                </button>
                <span style={{...T({fontSize:11,color:"#9ca3af",textAlign:"center"})}}>
                  Section {TABS.findIndex(t=>t.id===tab)+1} of {TABS.length}
                </span>
                <button onClick={()=>nx&&switchTab(nx.id)} disabled={!nx}
                  style={{padding:"6px 10px",borderRadius:999,border:`1.5px solid ${nx?B.dark:"#e5e7eb"}`,background:"transparent",color:nx?B.dark:"#d1d5db",whiteSpace:"nowrap",...H({fontSize:11})}}>
                  {nx?`${nx.emoji} ${nx.label} →`:""}
                </button>
              </div>
            );
          })()}
        </div>
      )}
      <div className="footer">Data: ASPCA &amp; Shelter Animals Count (2023–24) • Felius Rescue Rangers © 2026</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
